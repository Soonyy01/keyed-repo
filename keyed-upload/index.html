<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keyed</title>
<meta name="description" content="Your key to the inner circle. Collect creator keys on BNB Chain.">
<meta name="theme-color" content="#f6f4fb">
<link rel="icon" type="image/webp" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <div class="bar">
      <a class="brand" href="#/" aria-label="Keyed home"><img src="logo.webp" alt="">Keyed</a>
      <button class="btn btn-dark" id="wallet" type="button">Connect wallet</button>
    </div>
    <div class="banner" id="banner" hidden></div>
  </nav>
  <nav class="tabbar" id="tabbar" aria-label="App sections">
    <a href="#/explore" data-nav="explore"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2.2 4.8-4.8 2.2 2.2-4.8z"/></svg>Discover</a>
    <a href="#/me" data-nav="me"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8.5" cy="15.5" r="4.5"/><path d="m11.7 12.3 8.3-8.3m-3 3 2.5 2.5m-5-0 2 2"/></svg>My keys</a>
    <a href="#/launch" data-nav="launch"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3.5l1.9 5 5 1.9-5 1.9-1.9 5-1.9-5-5-1.9 5-1.9z"/><path d="M18 3v4m-2-2h4M18 15v4m-2-2h4"/></svg>Creator studio</a>
    <a href="#/messages" data-nav="messages"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a8 8 0 0 1-11.6 7.1L4 20l1.4-4.2A8 8 0 1 1 20 11.5z"/></svg>Messages</a>
  </nav>
  <main id="view" tabindex="-1"></main>
  <footer class="foot">
    <span>© 2026 Keyed · Experimental, unaudited contracts. Collecting keys carries risk.</span>
    <span><a href="#/info">How it works</a> · <a href="#/explore">Discover</a> · <a id="xlink" href="https://x.com/" target="_blank" rel="noopener">X</a></span>
  </footer>
</div>
<nav class="dock" aria-label="Shortcuts">
  <a class="tile t-home" href="#/" data-dock="home" aria-label="Keyed home"><img src="logo.webp" alt=""></a>
  <a class="tile t-key" href="#/explore" data-dock="app" aria-label="Open the app"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="15" cy="9" r="5"/><path d="M11.4 12.6 4 20m3-3 2 2m-4-0.5 1.5 1.5"/></svg></a>
  <button class="tile t-wallet" id="dockWallet" type="button" data-dock="wallet" aria-label="Wallet"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18" stroke="#ffd36a"/><path d="M3 13h18" stroke="#7fe0b0"/><circle cx="16.5" cy="15.8" r="1"/></svg></button>
  <a class="tile t-info" href="#/info" data-dock="info" aria-label="How Keyed works"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg></a>
</nav>
<div class="toast" id="toast" role="status" hidden></div>
<div class="modal" id="walletModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="wmTitle">
    <h3 id="wmTitle">Connect a wallet</h3>
    <div id="walletList" class="wallet-list"></div>
    <button class="btn btn-ghost" id="wmClose" type="button">Cancel</button>
  </div>
</div>
<script src="config.js"></script>
<script src="vendor/ethers.umd.min.js"></script>
<script src="app.js"></script>
<script type="module" src="privy.js"></script>
</body>
</html>
